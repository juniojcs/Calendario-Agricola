<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2e6;--card:#fff;--ink:#1d2a1f;--mute:#5d6b5f;--line:#d6ddc9;--leaf:#2f6b3a;--gold:#a8680a;--chip:#e1e8d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111912;--card:#1a251c;--ink:#e6eddc;--mute:#9fb0a0;--line:#2c3b2f;--leaf:#6fc283;--gold:#e8b04a;--chip:#263629}}
:root[data-theme="dark"]{--bg:#111912;--card:#1a251c;--ink:#e6eddc;--mute:#9fb0a0;--line:#2c3b2f;--leaf:#6fc283;--gold:#e8b04a;--chip:#263629}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}
.hero{background:#1b2540;color:#f4efd9;border-radius:20px;padding:18px;display:flex;gap:16px;align-items:center}
.hero svg{flex:none;width:92px;height:92px}
.hero h1{font-size:1.5rem;line-height:1.15}
.hero p{margin:4px 0 0;font-size:.88rem;opacity:.85}
.foco{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:.92rem}
.date{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:.9rem;color:var(--mute)}
input[type=date],button{font:inherit;color:var(--ink)}
input[type=date]{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
button{cursor:pointer}
.tabs{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin:10px 0}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:600}
.tabs .on{background:var(--card);box-shadow:0 1px 2px #0003}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:.78rem;color:var(--mute)}
.stats b{display:block;font:600 1.4rem Fraunces,Georgia,serif;color:var(--ink)}
.row{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:.85rem}
.chip.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
@media(prefers-color-scheme:dark){.chip.on{color:#10190f}}
details{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;margin:8px 0}
summary{list-style:none;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
summary::-webkit-details-marker{display:none}
summary b{display:block}
summary small{color:var(--mute)}
.tag{flex:none;font-size:.72rem;border-radius:99px;padding:2px 8px;background:var(--chip);white-space:nowrap}
.tag.m{background:var(--gold);color:#fff}
.tag.off{opacity:.6}
.det{padding:0 12px 12px;font-size:.9rem}
.det p{margin:6px 0}
.mes{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:8px}
.mes i{font-style:normal;text-align:center;font-size:.7rem;padding:4px 0;border-radius:5px;background:var(--chip);color:var(--mute)}
.mes .S{background:var(--leaf);color:#fff}.mes .E{background:var(--gold);color:#fff}
.mes .cur{outline:2px solid var(--ink)}
@media(prefers-color-scheme:dark){.mes .S{color:#10190f}}
.mrow{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.mrow.on{border-color:var(--leaf);border-width:2px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--chip);margin:6px 0}
.bar span:first-child{background:var(--leaf)}.bar span:last-child{background:var(--gold)}
.mrow small{color:var(--mute)}
.leg{font-size:.8rem;color:var(--mute)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tw{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:8px}
table{border-collapse:collapse;min-width:940px;width:100%;font-size:.86rem}
th{position:sticky;top:0;background:var(--leaf);color:#fff;text-align:left;padding:8px;font-weight:600;white-space:nowrap}
@media(prefers-color-scheme:dark){th{color:#10190f}}
td{padding:8px;border-top:1px solid var(--line);vertical-align:top}
tr[data-k]{cursor:pointer}
tr.S td:nth-child(4),tr.S td:nth-child(5){background:#2f6b3a22}
tr.E td:nth-child(4),tr.E td:nth-child(5){background:#a8680a22}
tr.x{color:var(--mute)}
td.hi{font-weight:700;color:var(--gold)}
tr.dt td{background:var(--chip);cursor:default}
.wP{color:var(--leaf);font-weight:600}.wE{color:var(--gold);font-weight:600}.wN{color:#b3261e;font-weight:700}
@media(prefers-color-scheme:dark){.wN{color:#ff8a7a}}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0 4px}
.cu{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}
.cu.on{border-color:var(--leaf)}
.cu-h{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:14px;text-align:left}
.cu-h b{display:block;font:600 1.15rem/1.25 Fraunces,Georgia,serif}
.cu-h small{color:var(--mute)}
.chev{font-size:1.6rem;line-height:1;color:var(--mute);transition:transform .15s}
.cu.on .chev{transform:rotate(90deg)}
.cu-b{margin:0;padding:0 14px 14px;display:grid;grid-template-columns:104px 1fr;gap:10px 12px;font-size:.9rem}
.cu-b dt{color:var(--mute);font-size:.78rem;padding-top:2px}
.cu-b dd{margin:0}
.cu-b .hi{font-weight:700;color:var(--gold)}
.cu-b .sec{grid-column:1/-1;margin-top:6px;padding-top:8px;border-top:1px solid var(--line);font:600 .74rem system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--leaf)}
.cu-b .sec:first-child{margin-top:0;padding-top:0;border-top:0}
.nt{display:block;color:var(--ink);font-weight:400;margin-top:2px}
@media(prefers-reduced-motion:reduce){.chev{transition:none}}
.srch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 12px;margin-top:10px}
.srch:focus-within{border-color:var(--leaf)}
.srch input{flex:1;min-width:0;border:0;background:none;padding:10px 0;font:inherit;color:var(--ink);outline:none}

as folhas ficam úmidas à noite.","Detestam umidade nas folhas e encharcamento; apodrecem caule e raízes facilmente.","Molhamento noturno favorece ferrugem, oídio e antracnose nas vagens.","Molhamento foliar prolongado favorece antracnose, ferrugem e mofo-branco (especialmente no inverno).","Molhar folhas favorece míldio e mancha-bacteriana, escurecendo as folhas.","Umidade foliar favorece mancha-púrpura e míldio; suspender rega 15–20 dias antes da colheita.","Molhar a rama favorece requeima (Phytophthora) e pinta-preta."],"lb":["SIM (Manhã / Água limpa)","EVITAR (Preferir raiz)","SIM (Tolera aspersão)","NÃO (Só na raiz)"],"si":["Microaspersão / Gotejamento / Hidroponia","Aspersão / Gotejamento","Gotejamento na base","Gotejamento / Aspersão só pela manhã","Gotejamento / Microaspersão baixa","Gotejamento sob mulching","Gotejamento / Rega no substrato","Gotejamento / Aspersão pela manhã","Gotejamento / Aspersão controlada","Gotejamento / Microaspersão diurna","Gotejamento / Sulco"],"f":[["Beta vulgaris var. cicla","Ameno a frio (15 °C a 22 °C); tolera leve calor em meia-sombra.","Solo fértil, rico em matéria orgânica, pH 6,0–6,8; calagem 30–60 dias antes se pH < 5,8.","Base: composto orgânico/húmus + fósforo; Cobertura: nitrogênio (esterco curtido/torta) a cada 20 dias para folhas tenras.","30–40 cm entre linhas x 25–30 cm entre plantas (canteiro).","1,5 a 2,0 cm (semeadura) ou colo nivelado no transplante.","50 a 70 dias (colheita contínua por corte de folhas externas).","Folhas externas bem desenvolvidas (25–35 cm), firmes e brilhantes, poupando o olho central."],["Barbarea verna","Ameno a frio (12 °C a 20 °C); calor intenso deixa folhas amargas.","Solo úmido, bem drenado e rico em matéria orgânica (pH 6,0–6,5).","Base: composto orgânico bem curtido; Cobertura: adubação nitrogenada leve após cada corte.","20–25 cm entre linhas x 15–20 cm entre plantas.","0,5 a 1,0 cm (semente miúda; cobrir levemente).","45 a 60 dias para 1º corte (rebrote a cada 25–30 dias).","Maços com hastes tenras de 15–20 cm antes da emissão do pendão floral."],["Apium graveolens","Ameno (15 °C a 21 °C); exigente em umidade constante sem encharcar.","Solo profundo, solto, rico em húmus e cálcio (pH 6,0–6,8); evita coração preto.","Base: composto orgânico + fósforo + boro/cálcio; Cobertura: N e K parcelados a cada 20 dias.","40–50 cm entre linhas x 25–30 cm entre plantas.","0,5 cm (sementeira) ou colo nivelado sem enterrar o olho.","100 a 130 dias após transplante.","Talos grossos, compactos e tenros (35–45 cm), antes de ficarem fibrosos ou ocos."],["Lactuca sativa","Ameno (15 °C a 24 °C); no verão usar cultivares tropicais e sombrite 30–50%.","Solo leve, bem drenado e rico em matéria orgânica (pH 6,0–6,8).","Base: composto/húmus + fósforo; Cobertura: nitrogênio leve aos 15 e 30 dias após transplante.","25–30 cm entre linhas x 25–30 cm entre plantas (americana: 35 x 35 cm).","0,5 cm na bandeja; transplante com torrão no nível do solo.","45 a 65 dias após semeadura (30–45 dias pós-transplante).","Planta bem cheia/cabeça firme, antes do alongamento do caule (pendoamento/amargor)."],["Allium ampeloprasum var. porrum","Ameno a frio (13 °C a 22 °C); suporta bem o inverno de MG.","Solo profundo, fofo e rico em matéria orgânica (pH 6,0–6,8); fazer amontoa.","Base: composto orgânico + fósforo; Cobertura: N e K aos 30, 60 e 90 dias junto com amontoa.","30–40 cm entre linhas x 12–15 cm entre plantas.","Transplante da muda em sulco de 8–10 cm para branquear o talo.","110 a 140 dias.","Pseudocaule (parte branca) com 2,5 a 4,0 cm de diâmetro e 15–20 cm bem branqueado."],["Cichorium intybus / Cichorium endivia","Ameno (14 °C a 24 °C); mais rústicos ao calor que a alface.","Solo fértil, franco e bem drenado (pH 6,0–6,8).","Base: composto orgânico curtido; Cobertura: adubo nitrogenado leve aos 20 dias.","30 cm entre linhas x 25 cm entre plantas.","0,5 a 1,0 cm.","55 a 75 dias (almeirão permite cortes sucessivos).","Folhas bem desenvolvidas e macias antes da emissão da haste floral."],["Asparagus officinalis","Subtropical/ameno (16 °C a 25 °C); exige período de repouso e sol pleno.","Solo muito profundo (>50 cm), arenoso/franco, sem encharcamento (pH 6,2–6,8).","Base: calcário + fósforo + esterco curtido no fundo do sulco; Cobertura anual de NPK após colheita.","1,20–1,50 m entre linhas x 30–40 cm entre coroas (cultura perene: 10+ anos).","Sulco de 20–25 cm de profundidade, cobrindo gradualmente conforme brota.","Início da colheita após 18–24 meses (safra dura 6–8 semanas/ano).","Turiões (brotos) com 18–22 cm de altura, pontas fechadas e compactas antes de abrir ramas."],["Portulaca oleracea / Tropaeolum majus","Beldroega: quente (20–32 °C); Capuchinha: ameno (14–24 °C).","Rústicas; solo leve, bem drenado e sem excesso de adubo químico (pH 5,8–6,8).","Apenas composto orgânico leve na base; excesso de N reduz flores da capuchinha.","30–40 cm entre linhas x 25–30 cm entre plantas.","0,5 a 1,5 cm (capuchinha: 2 cm).","35 a 55 dias.","Ramos tenros antes da floração (beldroega) ou folhas jovens e flores abertas (capuchinha)."],["Brassica oleracea var. italica / botrytis","Ameno a frio (14 °C a 22 °C); cultivares de verão toleram até 26 °C.","Solo fértil, rico em matéria orgânica e cálcio (pH 6,0–6,8).","Base: composto + fósforo + Boro e Molibdênio (essenciais para evitar talo oco); Cobertura: N e K.","70–80 cm entre linhas x 40–50 cm entre plantas.","0,5–1,0 cm na bandeja; transplante com 4–5 folhas definitivas.","75 a 105 dias.","Cabeça/inflorescência grande, compacta e firme, com botões florais ainda bem fechados."],["Brassica rapa subsp. pekinensis","Ameno a frio (13 °C a 21 °C); calor excessivo causa pendoamento e queima de borda.","Solo fértil, bem drenado, rico em cálcio e matéria orgânica (pH 6,0–6,8).","Base: composto + fósforo + cálcio; Cobertura: N aos 15 e 30 dias pós-transplante.","40–50 cm entre linhas x 30–35 cm entre plantas.","0,5–1,0 cm (bandeja ou semeadura direta com desbaste).","55 a 75 dias.","Cabeça alongada bem fechada e firme ao apertar levemente."],["Brassica oleracea var. gemmifera / gongylodes","Frio a ameno (12 °C a 20 °C); exigem noites frescas para formar mini-cabeças ou globo.","Solo profundo, bem estruturado, pH 6,0–6,8, rico em matéria orgânica e boro.","Base: composto + fósforo + Boro; Cobertura: N e K parcelados a cada 20 dias.","Couve-rábano: 35 x 20 cm | Couve-de-bruxelas: 70 x 50 cm.","0,5–1,0 cm na bandeja.","Couve-rábano: 55–70 dias | Couve-de-bruxelas: 100–130 dias.","Couve-rábano: globo tenro com 6–8 cm (antes de lenhificar); Bruxelas: brotos firmes de 2,5–3,5 cm de baixo para cima."],["Brassica oleracea var. acephala","Ameno a quente (15 °C a 28 °C); produz o ano todo em MG.","Solo fértil, rico em matéria orgânica e bem drenado (pH 6,0–6,8).","Base: composto orgânico + fósforo; Cobertura: nitrogênio + matéria orgânica a cada 30 dias.","70–80 cm entre linhas x 40–50 cm entre plantas.","Mudas de rebento (brotação lateral) enterradas 5–8 cm ou bandeja.","60 a 75 dias para iniciar colheita (produz por 12+ meses).","Folhas adultas bem expandidas (25–35 cm), verdes e tenras, mantendo sempre 5–6 folhas no ponteiro."],["Tetragonia tetragonioides (Nova Zelândia) / Spinacia oleracea","Nova Zelândia: quente/ameno (18–28 °C); Comum: frio (12–20 °C).","Solo leve, fértil e bem drenado (pH 6,0–6,8).","Base: composto orgânico curtido; Cobertura: nitrogênio leve após cada desbaste/corte.","30–40 cm entre linhas x 25–30 cm entre plantas.","1,5 a 2,0 cm (deixar semente de molho 12 h antes de semear).","50 a 65 dias.","Ramos e folhas tenras de 15–20 cm antes da floração."],["Brassica juncea","Ameno a frio (14 °C a 23 °C); ciclo muito rápido.","Solo fértil e bem drenado, rico em matéria orgânica (pH 6,0–6,8).","Base: composto orgânico; Cobertura: nitrogênio leve aos 15 dias se necessário.","30 cm entre linhas x 20–25 cm entre plantas.","0,5 a 1,0 cm.","40 a 55 dias.","Folhas tenras bem desenvolvidas antes do pendoamento floral."],["Pereskia aculeata / Xanthosoma taioba","Tropical/subtropical (18 °C a 32 °C); muito rústicas em MG.","Ora-pro-nóbis: qualquer solo drenado; Taioba: solo úmido e muito rico em húmus (pH 5,8–6,5).","Base: esterco/composto curtido + fósforo; Manutenção semestral com matéria orgânica.","Ora-pro-nóbis: 1,0–1,5 m (cerca/poda) | Taioba: 60 x 50 cm (meia-sombra ou sol).","Estacas de 20 cm enterradas 10 cm (ora-pro-nóbis) ou rizomas a 8–10 cm (taioba).","70 a 90 dias para primeiras colheitas (perenes).","Ponteiros e folhas jovens suculentas (ora-pro-nóbis) ou folhas bem abertas com talo firme (taioba)."],["Cichorium intybus var. foliosum","Frio a ameno (12 °C a 20 °C); noites frescas garantem cor roxa intensa.","Solo fértil, solto, bem drenado e rico em matéria orgânica (pH 6,0–6,8).","Base: composto orgânico + fósforo; Cobertura: N e K aos 20 dias pós-transplante.","30–35 cm entre linhas x 25–30 cm entre plantas.","0,5 cm na bandeja.","65 a 85 dias.","Cabeça arredondada bem compacta e arroxeada com nervuras brancas."],["Brassica oleracea var. capitata","Ameno a frio (14 °C a 22 °C); híbridos de verão toleram até 27 °C.","Solo profundo, fértil, bem drenado e rico em cálcio/boro (pH 6,0–6,8).","Base: composto + fósforo + Boro; Cobertura: N e K aos 20 e 40 dias pós-transplante.","60–70 cm entre linhas x 40–45 cm entre plantas.","0,5–1,0 cm na bandeja.","80 a 110 dias.","Cabeça bem fechada, pesada e firme ao toque, antes de rachar."],["Eruca vesicaria","Ameno (15 °C a 24 °C); no verão usar sombrite 30–50% e rega frequente.","Solo solto, fértil e rico em matéria orgânica (pH 6,0–6,8).","Base: composto/húmus curtido; Cobertura: geralmente dispensada pelo ciclo curto (ou N muito leve).","20–25 cm entre linhas x 10–15 cm entre plantas (ou semeadura em sulco contínuo).","0,5 a 1,0 cm.","30 a 45 dias.","Folhas com 12–18 cm, verde-escuras e tenras, antes do pendão floral (senão amarga)."],["Cucurbita pepo","Quente a ameno (20 °C a 30 °C); sensível a geadas.","Solo fértil, bem drenado e rico em matéria orgânica (pH 6,0–6,5).","Cova: 2–3 L de composto + fósforo; Cobertura: N e K a cada 15 dias após início da floração.","1,00 m entre linhas x 60–80 cm entre covas.","2,0 a 3,0 cm (2–3 sementes por cova, desbastar para 1–2).","45 a 55 dias (colheita a cada 2–3 dias).","Frutos tenros com 15–20 cm, casca brilhante e sementes ainda imaturas."],["Cucurbita moschata / maxima / híbrida","Quente (22 °C a 32 °C); exige sol pleno e boa polinização por abelhas.","Solo profundo, bem drenado, pH 5,8–6,5 (fazer calagem se ácido).","Cova (40x40x40 cm): 4–5 L de esterco/composto + fósforo; Cobertura: K e N no início das ramas.","2,50–3,00 m entre linhas x 1,50–2,00 m entre covas (cabotiá precisa polinizadora).","3,0 a 4,0 cm.","90 a 120 dias.","Casca dura (não marca com a unha), pedúnculo seco/corticoso e cor característica da cultivar."],["Cynara cardunculus var. scolymus","Ameno a frio (13 °C a 22 °C); exige inverno ameno para diferenciar botões.","Solo profundo (>50 cm), fértil e perfeitamente drenado (pH 6,2–6,8).","Cova: composto orgânico + fósforo + potássio; Cobertura anual após poda de verão.","1,20–1,50 m entre linhas x 80–100 cm entre plantas.","Rebentos/mudas enterrados no nível do colo (sem cobrir o olho).","150 a 180 dias (perene por 3–4 anos).","Capítulos (botões florais) grandes, firmes e com brácteas ainda bem fechadas."],["Solanum melongena","Quente (22 °C a 30 °C); frio retarda crescimento e aborta flores.","Solo profundo, solto, bem drenado e rico em matéria orgânica (pH 6,0–6,5).","Cova: 3–4 L de composto + fósforo + cálcio; Cobertura: N e K a cada 20 dias na frutificação.","1,00–1,20 m entre linhas x 60–80 cm entre plantas (tutorar).","0,5–1,0 cm na bandeja; transplante com 4–5 folhas.","85 a 100 dias.","Frutos bem desenvolvidos, casca muito brilhante e firme, antes de perder o brilho (sementes duras)."],["Sechium edule","Ameno a quente (18 °C a 28 °C); exige latada/parreira alta e ventilada.","Solo profundo, bem drenado e rico em matéria orgânica (pH 5,8–6,5).","Cova (50x50x50 cm): 8–10 L de esterco curtido + fósforo; Cobertura trimestral com composto/NPK.","3,00–4,00 m x 3,00–4,00 m sob parreira de 1,80–2,00 m de altura.","Fruto brotado enterrado 2/3 inclinado, deixando o broto para fora.","100 a 120 dias (produz por vários meses).","Frutos tenros com 12–16 cm, casca lisa/brilhante e sem fibrosidade."],["Solanum aethiopicum","Quente (22 °C a 32 °C); muito rústico no verão de MG.","Solo bem drenado, fertilidade média a alta (pH 5,8–6,5).","Cova: 3 L de composto + fósforo; Cobertura: N e K a cada 20–25 dias durante a colheita.","1,00–1,20 m entre linhas x 60–70 cm entre plantas.","0,5–1,0 cm na bandeja.","80 a 95 dias.","Frutos verde-brilhantes, firmes e tenros, antes de começarem a amarelar/avermelhar."],["Passiflora edulis","Tropical quente (22 °C a 30 °C); exige sol pleno e polinização por mamangavas.","Solo profundo, bem drenado, sem encharcamento (pH 5,8–6,5); calagem na cova.","Cova (40x40x40 cm): calcário + 10 L esterco curtido + fósforo + zinco/boro; Cobertura K e N.","2,50–3,00 m entre linhas x 2,50–3,00 m na espaldeira (fio a 1,80–2,00 m).","Muda com torrão no nível do solo (evitar enterrar o colo por causa de Fusarium).","180 a 240 dias (6 a 8 meses).","Frutos maduros que se soltam naturalmente e caem na palhada sob a espaldeira."],["Cucumis anguria","Quente (24 °C a 34 °C); muito rústico e resistente ao calor.","Solo leve, arenoso/franco e bem drenado (pH 5,8–6,5).","Cova: 2–3 L de esterco curtido + fósforo; Cobertura leve de N e K na floração.","1,50–2,00 m entre linhas x 80–100 cm entre covas (rasteiro ou tutorado).","1,5 a 2,5 cm (semeadura direta).","55 a 70 dias.","Frutos verdes, tenros e com espinhos macios, antes de amarelar e endurecer sementes."],["Citrullus lanatus","Quente e ensolarado (25 °C a 32 °C); exige tempo seco na maturação para ficar doce.","Solo leve, arenoso/franco, profundo e bem drenado (pH 5,8–6,5).","Cova: 4–5 L de composto + fósforo; Cobertura: K alto no enchimento dos frutos; reduzir água no final.","2,50–3,00 m olheita a cada 2 dias).","Frutos cilíndricos, verdes e firmes (caipira: 12–16 cm; japonês: 20–25 cm) antes de amarelar."],["Physalis peruviana","Ameno a quente (18 °C a 26 °C); exige tutoramento em V ou cerca.","Solo leve, bem drenado e fertilidade moderada (pH 5,8–6,5); excesso de N dá só folha.","Cova: composto curtido + fósforo; Cobertura leve de potássio na florada.","1,20–1,50 m entre linhas x 80–100 cm entre plantas.","0,5 cm na bandeja.","90 a 110 dias.","Cálice (cápsula) seco e cor de palha, com fruto interno amarelo-alaranjado."],["Capsicum chinense / baccatum / frutescens","Quente (22 °C a 32 °C); bode/biquinho exigem mais calor para germinar e vingar.","Solo profundo, bem drenado e rico em matéria orgânica (pH 6,0–6,5).","Cova: 3 L de composto + fósforo + cálcio; Cobertura: K e N a cada 25 dias.","1,00–1,20 m entre linhas x 60–80 cm entre plantas.","0,5 a 1,0 cm na bandeja.","85 a 120 dias (malagueta/bode são mais tardias e perenes).","Cor característica madura (vermelha, amarela ou salmão) e frutos firmes com brilho."],["Capsicum annuum","Ameno a quente (20 °C a 28 °C); calor >32 °C aborta flores e queima frutos.","Solo fértil, solto, bem drenado e rico em cálcio (pH 6,0–6,8).","Base: composto + fósforo + cálcio/boro (evita podridão apical); Cobertura: N e K parcelados.","1,00 m entre linhas x 40–50 cm entre plantas (tutorar).","0,5 a 1,0 cm na bandeja.","80 a 100 dias (verde) ou 110–130 dias (vermelho/amarelo).","Frutos grandes, firmes, paredes grossas e casca lisa brilhante."],["Abelmoschus esculentus","Quente (24 °C a 34 °C); não tolera frio nem encharcamento.","Solo profundo, bem drenado, pH 6,0–6,5.","Base: composto + fósforo; Cobertura: N e K aos 25 e 50 dias.","1,00 m entre linhas x 30–40 cm entre plantas.","2,0 a 3,0 cm (deixar semente de molho 12 h para acelerar germinação).","55 a 65 dias (colheita a cada 2 dias).","Vagens tenras com 10–14 cm cuja ponta quebra facilmente ao dobrar (antes de fibrosar)."],["Vigna unguiculata subsp. sesquipedalis","Quente (22 °C a 32 °C); trepadeira vigorosa que exige cerca/parreira.","Solo bem drenado, fertilidade média (pH 5,8–6,5).","Base: composto + fósforo (fixa nitrogênio); Cobertura leve de potássio na florada.","1,20 m entre linhas x 40–50 cm entre plantas.","2,5 a 3,5 cm.","60 a 75 dias.","Vagens longas (40–60 cm), verdes e tenras, antes dos grãos incharem."],["Solanum lycopersicum","Ameno a quente (18 °C a 27 °C); noites frescas favorecem pegamento de frutos.","Solo profundo, bem drenado, rico em cálcio e matéria orgânica (pH 6,0–6,5).","Base: composto + fósforo + cálcio/boro; Cobertura: K e cálcio semanais na frutificação.","1,00–1,20 m entre linhas x 50–60 cm entre plantas (tutorar e desbrotar).","0,5–1,0 cm na bandeja.","70–85 dias (cereja) | 85–105 dias (italiano/salada).","Início de mudança de cor (salada) ou cor plena vermelha/amarela (cereja/italiano)."],["Salvia rosmarinus / Thymus / Origanum / Salvia","Ameno a quente (16 °C a 28 °C); exigem sol pleno e baixa umidade.","Solo arenoso/pedregoso, extremamente bem drenado (pH 6,2–7,0).","Adubação muito leve (pouco composto na cova); excesso de N reduz óleos essenciais.","40–60 cm entre plantas (perenes).","Estacas de 10–15 cm enterradas 5 cm ou mudas.","60 a 90 dias para 1ª poda de colheita.","Ramos jovens antes da floração plena (máxima concentração de aroma)."],["Arachis hypogaea / Cajanus cajan","Quente (20 °C a 30 °C); plantio principal nas águas (Set–Nov em MG).","Solo leve, arenoso/franco e bem drenado (facilita penetração dos ginóforos do amendoim); calagem se ácido.","N dispensável (fixação biológica); priorizar fósforo (termofosfato/superfosfato) e cálcio na florada.","Amendoim: 60 cm (ereto) ou 80–90 cm (rasteiro) x 15–20 cm | Guandu: 1,0–1,5 m x 50 cm.","Amendoim: 5,0 a 8,0 cm | Guandu: 3,0 a 4,0 cm.","Amendoim: 90 a 150 dias | Guandu: 120–180 dias.","Amendoim: folhas inferiores amarelando e vagens internas reticuladas/escuras."],["Matricaria chamomilla","Ameno a frio (12 °C a 21 °C); tolera geadas leves.","Solo leve, arenoso/franco e bem drenado (pH 5,8–6,8).","Adubação orgânica leve na base; excesso de N favorece pulgões e reduz flores.","30 cm entre linhas x 20 cm entre plantas.","Superficial (0,2 cm — semente precisa de luz para germinar).","65 a 85 dias.","Capítulos florais recém-abertos com pétalas brancas horizontais e miolo amarelo."],["Cymbopogon citratus / Cymbopogon winterianus","Quente (20 °C a 32 °C); sol pleno.","Solo bem drenado, rústico (pH 5,5–6,5).","Base: composto orgânico + fósforo; Cobertura anual com esterco curtido.","80–100 cm x 80–100 cm (ótimo em bordaduras).","Divisão de touceira (perfilhos) enterrada 8–10 cm.","90 a 120 dias para 1º corte (rebrote contínuo).","Folhas adultas cortadas a 10–15 cm acima do solo para rebrota vigorosa."],["Allium fistulosum / Petroselinum crispum","Ameno a quente (15 °C a 26 °C); salsinha prefere clima mais ameno.","Solo fértil, solto e rico em matéria orgânica (pH 6,0–6,8).","Base: composto/húmus; Cobertura: nitrogênio leve após cada corte.","20–25 cm entre linhas x 15 cm entre touceiras/plantas.","0,5–1,0 cm (salsinha: deixar semente de molho 24 h).","55 a 75 dias para 1º corte.","Cebolinha: folhas inteiras destacadas na base; Salsinha: talos externos bem formados."],["Coriandrum sativum","Quente a ameno (18 °C a 28 °C); cultivares tropicais resistem bem ao calor.","Solo leve, fértil e bem drenado (pH 6,0–6,8).","Base: composto curtido; Cobertura: nitrogênio leve aos 15 dias.","20–25 cm entre linhas x 5–10 cm (semeadura direta; quebrar sementes levemente).","1,0 a 1,5 cm.","35 a 45 dias.","Plantas com 15–20 cm de altura, folhas abundantes e antes do pendoamento."],["Anethum graveolens / Foeniculum vulgare","Ameno (15 °C a 23 °C); não transplantar (raiz pivotante sensível).","Solo profundo, solto e bem drenado (pH 6,0–6,8).","Base: composto orgânico leve + fósforo.","Endro: 30 x 15 cm | Funcho: 50 x 30 cm.","1,0 cm (semeadura direta).","50–65 dias (folhas) | 90–110 dias (sementes/bulbo).","Folhas jovens .","3,0 a 5,0 cm.","95 a 120 dias.","Plantas amarelando e vagens secas antes da deiscência."],["Mentha spp. / Melissa officinalis","Ameno a quente (16 °C a 26 °C); toleram meia-sombra no verão.","Solo úmido, solto e rico em matéria orgânica (pH 6,0–6,8); hortelã pede canteiro contido.","Base: composto/húmus curtido; Cobertura orgânica após podas.","30–40 cm x 30 cm.","Estacas/rizomas de 10 cm enterrados 4–5 cm.","45 a 60 dias para 1º corte.","Ramos vigorosos antes da floração para máximo teor de mentol/citral."],["Laurus nobilis","Subtropical/ameno (15 °C a 26 °C); sol pleno ou meia-sombra.","Solo profundo, bem drenado e fértil (pH 6,0–6,8).","Cova: composto curtido + fósforo; Adubação anual leve na primavera.","2,00–3,00 m entre plantas (pode conduzir em vaso/poda).","Muda com torrão no nível do solo.","180+ dias para colheitas leves (arbusto/árvore perene).","Folhas adultas verde-escuras e firmes (nunca retirar mais de 25% da copa de uma vez)."],["Ocimum basilicum","Quente (22 °C a 32 °C); sensível a frio intenso.","Solo solto, fértil e bem drenado (pH 6,0–6,8).","Base: composto/húmus; Cobertura leve de N após podas de ponteiro.","40–50 cm entre linhas x 30–40 cm entre plantas.","0,3–0,5 cm na bandeja ou estaca enraizada.","45 a 60 dias (podar pendões florais para prolongar vida).","Ponteiros e folhas jovens aromáticas antes de abrir flores."],["Origanum majorana / Artemisia dracunculus","Ameno (15 °C a 24 °C); sol pleno e boa ventilação.","Solo leve, arenoso/franco e muito bem drenado (pH 6,2–7,0).","Adubação orgânica moderada na base.","35–40 cm x 30 cm.","Mudas ou estacas a 4–5 cm.","60 a 75 dias.","Ponteiros tenros imediatamente antes do início da floração."],["Glycine max (hortaliça)","Quente (22 °C a 30 °C); exige dias longos (primavera/verão).","Solo fértil, bem drenado, pH 5,8–6,5 (calagem se ácido).","N dispensável (inoculante *Bradyrhizobium*); priorizar fósforo e potássio.","50–60 cm entre linhas x 10–15 cm entre plantas.","3,0 a 4,0 cm.","75 a 90 dias. tíssimo bem drenado (pH 5,8–6,5).","Cova: composto curtido + fósforo + cálcio; Evitar encharcamento e esterco fresco no caule.","2,50–3,00 m entre linhas x 2,00–2,50 m entre mourões (2–3 mudas por mourão).","Cladódio curado enterrado apenas 3 a 5 cm junto ao mourão.","12 a 18 meses para primeiras floradas (safra Nov–Abr).","Casca totalmente vermelha ou amarela com brácteas começando a murchar nas pontas."],["Allium sativum / Allium cepa","Ameno a frio no crescimento (13 °C a 22 °C) e seco/quente na maturação do bulbo.","Solo solto, leve, sem torrões e bem drenado (pH 6,0–6,5).","Base: composto curtido + fósforo; Cobertura: N até início da bulbificação, depois só K.","Alho: 25 x 10 cm | Cebola: 25–30 x 10–12 cm.","Alho (bulbilho com ponta para cima): 2–3 cm | Cebola (muda): 2 cm.","Alho: 120–150 dias | Cebola: 110–140 dias.","Tombamento natural ('estalo') de 60–70% das folhas e amarelecimento; curar à sombra 10–15 dias."],["Maranta arundinacea","Quente e úmido (22 °C a 30 °C); tolera meia-sombra.","Solo profundo, solto, arenoso/franco e rico em húmus (pH 5,5–6,5).","Base: composto orgânico + fósforo + potássio.","80–100 cm entre linhas x 40–50 cm entre rizomas.","8,0 a 10,0 cm.","9 a 11 meses.","Secagem e amarelecimento completo da parte aérea no inverno."],["Ipomoea batatas","Quente (22 °C a 32 °C); muito rústica e tolerante à seca após pegamento.","Solo leve, arenoso/franco, bem drenado (leiras altas de 25–30 cm), pH 5,5–6,2.","Base: fósforo e potássio; Evitar excesso de nitrogênio (dá muita rama e pouca batata).","80–100 cm entre leiras x 30–35 cm entre ramas.","Ramas de 25–30 cm com 3–4 nós enterrados inclinados a 8–10 cm.","110 a 150 dias.","Amarelecimento basal das folhas e raízes tuberosas firmes com casca lisa (150–400 g)."],["Solanum tuberosum","Ameno (15 °C a 22 °C); noites frescas são essenciais para tuberização.","Solo profundo, solto, bem drenado (pH 5,2–5,8 — acidez leve reduz sarna); fazer amontoa.","Base: fósforo + potássio + composto curtido; Cobertura: N e K aos 25 dias antes da amontoa.","75–80 cm entre linhas x 25–30 cm entre batatas-semente.","8,0 a 10,0 cm no sulco, cobrindo com amontoa alta aos 25–30 dias.","90 a 110 dias.","Secagem completa da rama (cortar rama 10 dias antes para firmar a pele dos tubérculos)."],["Smallanthus sonchifolius","Ameno a subtropical (16 °C a 25 °C).","Solo profundo, solto e rico em matéria orgânica (pH 5,8–6,5).","Base: composto orgânico + fósforo + potássio.","1,00 m entre linhas x 60–80 cm entre plantas.","Rizóforos (mudas) enterrados a 8–10 cm.","8 a 10 meses.","Floração e secagem natural das hastes aéreas no outono/inverno."],["Beta vulgaris","Ameno a frio (15 °C a 22 °C); calor excessivo deixa raiz fibrosa e desbotada.","Canteiro solto, sem pedras ou esterco fresco, pH 6,0–6,8.","Base: composto curtido + fósforo + Boro (evita coração preto); Cobertura: N e K aos 20 dias.","25–30 cm entre linhas x 10–12 cm entre plantas (desbastar glomérulos).","1,5 a 2,0 cm.","60 a 75 dias.","Raízes globulares firmes com 6 a 8 cm de diâmetro, antes de ficarem lenhosas."],["Allium cepa var. aggregatum / Allium cepa","Ameno no início (14 °C a 22 °C) e seco na colheita.","Solo solto, fértil e bem drenado (pH 6,0–6,5).","Base: composto + fósforo; Cobertura: N inicial e K na formação dos bulbos.","25–30 cm entre linhas x 12–15 cm entre bulbos/mudas.","2,0 a 3,0 cm.","100 a 130 dias.","Estalo/tombamento das folhas e túnica externa seca e bem pigmentada."],["Daucus carota","Ameno (16 °C a 22 °C); usar cultivares de verão (Brasília/Alvorada) entre Out e Fev.","Canteiro profundo (30 cm), muito solto, peneirado e sem esterco fresco (pH 6,0–6,5).","Base: composto bem curtido + fósforo + potássio; N moderado.","20–25 cm entre linhas x 5–7 cm entre plantas após desbaste (só semeadura direta).","0,5 a 1,0 cm (manter superfície úmida até germinar em 7–14 dias).","85 a 105 dias.","Ombro da raiz com 2,5–3,5 cm de diâmetro aflorando no solo e folhas inferiores amarelando."],["Curcuma longa / Zingiber officinale","Quente e úmido (22 °C a 32 °C); plantio no início das chuvas (Set–Nov).","Solo profundo, solto, drenado e muito rico em matéria orgânica (pH 5,8–6,5).","Base: composto orgânico abundante + fósforo + potássio; Cobertura com mulching.","60–80 cm entre linhas x 25–30 cm entre rizomas.","5,0 a 8,0 cm (rizomas-semente com gemas saudáveis).","8 a 10 meses.","Amarelecimento e secagem total das folhas entre junho e agosto."],["Colocasia esculenta / Dioscorea spp.","Quente e úmido (22 °C a 32 °C); cará-de-espinho/moela pode ser tutorado.","Solo profundo, fértil e rico em matéria orgânica (pH 5,5–6,5).","Base: esterco/composto curtido + fósforo + potássio.","80–100 cm entre linhas x 40–50 cm entre covas.","8,0 a 12,0 cm.","7 a 9 meses.","Amarelecimento e secagem das folhas no outono/inverno."],["Manihot esculenta","Quente (22 °C a 32 °C); plantio no início das águas (Set–Nov em MG).","Solo profundo, solto, bem drenado (sem encharcamento para não apodrecer raiz), pH 5,5–6,5.","Base: fósforo e potássio (composto na cova); dispensa adubação pesada em solo fértil.","1,00 m entre linhas x 60–80 cm entre manivas.","Manivas de 15–20 cm (5–7 gemas) plantadas horizontalmente a 8–10 cm.","8 a 12 meses (macaxeira de mesa: ideal 8–10 meses para cozinhar bem).","Folhas inferiores amarelando/caindo e raízes bem engrossadas (testar 1 pé antes)."],["Brassica rapa var. rapa","Ameno a frio (13 °C a 21 °C).","Canteiro solto, fértil e bem drenado (pH 6,0–6,8).","Base: composto curtido + fósforo + Boro.","25–30 cm entre linhas x 10–15 cm entre plantas.","1,0 a 1,5 cm (semeadura direta).","45 a 60 dias.","Raízes firmes e lisas com 6–8 cm de diâmetro, antes de ficarem esponjosas."],["Raphanus sativus","Ameno (15 °C a 24 °C); ciclo ultra-rápido, ideal para consórcio entre culturas lentas.","Canteiro leve, solto e úmido sem encharcar (pH 6,0–6,8).","Base: composto/húmus curtido; rega regular (falta d'água racha e deixa picante).","20 cm entre linhas x 5–8 cm entre plantas.","1,0 cm (semeadura direta).","25 a 35 dias.","Raiz globular com 2,5–3,5 cm de diâmetro; colher na hora para não rachar nem ficar oca."]]};
const MN=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const T=29.530588853,CUT=[1.85,5.54,9.23,12.92,16.61,20.3,23.99,27.68];
const PN=["Lua Nova","Lua Nova → Crescente","Lua Crescente","Lua Crescente → Cheia","Lua Cheia","Lua Cheia → Minguante","Lua Minguante","Lua Minguante → Nova","Lua Nova"];
const FO=[["Lua Nova","ideal para preparo do solo, adubação orgânica, podas de limpeza e semeadura de raízes e folhosas de ciclo curto."],["Lua Crescente","seiva subindo: excelente para folhosas, frutos, leguminosas, temperos e transplante de mudas."],["Lua Cheia","pico de seiva nas copas: ótimo para frutos suculentos e brássicas de cabeça."],["Lua Minguante","seiva concentrada nas raízes: melhor para mandioca, batata-doce, cenoura, beterraba, cebola e alho."]];
const FM=[0,1,1,1,2,2,3,3,0];
const st={d:new Date(),cat:"",q:"",campo:0,estufa:0,fav:0,w:0,off:0,tab:0};
st.d.setHours(0,0,0,0);
const serial=d=>Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/864e5);
const phase=d=>((serial(d)+0.5-46040.82778)%T+T)%T;
const seg=p=>{const i=CUT.findIndex(c=>p<c);return i<0?8:i};
const fav=(l,n)=>["Crescente","Cheia","Minguante"].some(w=>l.includes(w)&&n.includes(w));
function moon(p){const k=Math.cos(2*Math.PI*p/T),rx=Math.abs(k)*44,w=p<T/2;
const a=w?0:1,b=w?(k>0?1:0):(k>0?0:1);
return `<svg viewBox="0 0 100 100" role="img" aria-label="Fase da Lua"><circle cx="50" cy="50" r="44" fill="#2c3860"/><path d="M50 6A44 44 0 0 ${a} 50 94A${rx.toFixed(1)} 44 0 0 ${b} 50 6Z" fill="#f4efd9"/></svg>`}
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function render(){
const d=st.d,mo=d.getMonth(),p=phase(d),s=seg(p),pn=PN[s],ilu=Math.round((1-Math.cos(2*Math.PI*p/T))/2*100),fo=FO[FM[s]];
const all=D.c.map(([cat,nome,forma,lua,j,m],i)=>({cat,nome,forma,lua,j,m,s:m[mo],f:fav(lua,pn),w:D.w[i],fi:D.f[i]}));
const ins=all.filter(x=>x.s!="-");
let L=all.filter(x=>(st.off||st.q||x.s!="-")&&(!st.cat||x.cat==st.cat)&&(!st.q||(norm(x.nome)+" "+norm(x.fi[0])).includes(norm(st.q)))&&(!st.fav||x.f&&x.s!="-")&&(!st.w||x.w[0]=="P")&&((!st.campo&&!st.estufa)||(st.campo&&x.s=="S")||(st.estufa&&x.s=="E")));
L.sort((a,b)=>(b.s!="-")-(a.s!="-")||b.f*(b.s!="-")-a.f*(a.s!="-")||a.nome.localeCompare(b.nome));
const cs=[...new Set(D.c.map(x=>x[0]))];
const chip=(t,on,k,v)=>`<button class="chip${on?" on":""}" data-k="${k}" data-v="${v}">${t}</button>`;
let h=`<section class="hero">${moon(p)}<div><h1>${pn}</h1><p>Dia ${p.toFixed(1)} do ciclo, cerca de ${ilu}% iluminada. Hemisfério Sul.</p></div></section>
<div class="foco"><b>${fo[0]}:</b> ${fo[1]}</div>
<div class="date"><label for="dt">Data</label><input id="dt" type="date" value="${iso(d)}"><button class="chip" data-k="hoje">Hoje</button><span>${MN[mo]}</span></div>
<div class="tabs"><button class="${st.tab?"":"on"}" data-k="tab" data-v="0">Culturas</button><button class="${st.tab?"on":""}" data-k="tab" data-v="1">Ano</button></div>`;
if(!st.tab){
h+=`<div class="stats"><div><b>${ins.length}</b>na época</div><div><b>${ins.filter(x=>x.s=="S").length} · ${ins.filter(x=>x.s=="E").length}</b>campo · estufa</div><div><b>${ins.filter(x=>x.f).length}</b>com lua favorável</div></div>
<p class="leg" style="margin:8px 0 0">Regra das folhas nas culturas da época: ${ins.filter(x=>x.w[0]=="N").length} só na raiz, ${ins.filter(x=>x.w[0]=="E").length} evitar, ${ins.filter(x=>x.w[0]=="P").length} toleram molhar.</p><div class="srch"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="Buscar cultura" aria-label="Buscar cultura" autocomplete="off" value="${st.q.replace(/"/g,"&quot;")}"></div>
<div class="row">${chip("Todas",!st.cat,"cat","")}${cs.map(c=>chip(c,st.cat==c,"cat",c)).join("")}</div>
<div class="row">${chip("Campo aberto",st.campo,"campo",1)}${chip("Estufa ou sombrite",st.estufa,"estufa",1)}${chip("Lua favorável",st.fav,"fav",1)}${chip("Pode molhar as folhas",st.w,"w",1)}${chip("Fora de época",st.off,"off",1)}</div>`;
st._L=L.map(x=>x.nome);
const ao=L.length&&L.every(x=>st.o&&st.o[x.nome]);
h+=L.length?`<div class="bar2"><span class="leg">${L.length} ${L.length==1?"cultura":"culturas"}. Toque no nome para abrir.</span><button class="chip" data-k="all">${ao?"Recolher tudo":"Expandir tudo"}</button></div>`+L.map(x=>{const on=st.o&&st.o[x.nome],f=x.s=="-",w=x.w[0];return `<div class="cu${on?" on":""}"><button class="cu-h" data-k="open" data-v="${encodeURIComponent(x.nome)}" aria-expanded="${on?"true":"false"}"><span><b>${x.nome}</b><small>${x.cat}</small></span><span class="chev" aria-hidden="true">›</span></button>`+(on?`<dl class="cu-b"><dt class="sec">Esta semana</dt><dt>Situação</dt><dd>${f?"Fora de época":x.s=="S"?"EXCELENTE (Campo Aberto)":"EXCELENTE (Estufa/Sombrite)"}</dd><dt>Status no mês</dt><dd>${x.s=="S"?"SIM":x.s=="E"?"EST":"—"}</dd><dt>Sinergia com a lua atual</dt><dd class="${x.f&&!f?"hi":""}">${f?"—":x.f?"ALTA (Lua Ideal Agora)":"Normal (Época Certa)"}</dd><dt class="sec">1. Clima e época</dt><dt>Nome científico</dt><dd><i>${x.fi[0]}</i></dd><dt>Clima e temperatura</dt><dd>${x.fi[1]}</dd><dt>Época e justificativa</dt><dd>${D.j[x.j]}</dd><dt>Lua ideal</dt><dd>${x.lua}</dd><dt>Meses de plantio</dt><dd><div class="mes">${[..."JFMAMJJASOND"].map((l,i)=>`<i class="${x.m[i]}${i==mo?" cur":""}" title="${MN[i]}">${l}</i>`).join("")}</div><p class="leg">Verde: campo aberto. Amarelo: estufa ou sombrite.</p></dd><dt class="sec">2. Solo, adubação e plantio</dt><dt>Solo e calagem</dt><dd>${x.fi[2]}</dd><dt>Adubação</dt><dd>${x.fi[3]}</dd><dt>Forma de plantio</dt><dd>${x.forma}</dd><dt>Profundidade</dt><dd>${x.fi[5]}</dd><dt>Espaçamento</dt><dd>${x.fi[4]}</dd><dt class="sec">3. Irrigação e colheita</dt><dt>Pode molhar folhas?</dt><dd class="w${w}">${D.lb[x.w[2]]}<span class="nt">${D.mo[x.w[1]]}</span></dd><dt>Sistema de irrigação</dt><dd>${D.si[x.w[3]]}</dd><dt>Ciclo até a colheita</dt><dd>${x.fi[6]}</dd><dt>Ponto de colheita</dt><dd>${x.fi[7]}</dd></dl>`:"")+`</div>`}).join(""):`<p class="leg">Nenhuma cultura com esses filtros. Tire um filtro para ver mais.</p>`;
}else{
const ct=D.m.map((m,i)=>[all.filter(x=>x.m[i]=="S").length,all.filter(x=>x.m[i]=="E").length]),mx=Math.max(...ct.map(c=>c[0]+c[1]));
h+=D.m.map((m,i)=>`<button class="mrow${i==mo?" on":""}" data-k="mes" data-v="${i}"><b>${MN[i]}</b> <small>${m[0]}</small><div class="bar"><span style="width:${ct[i][0]/mx*100}%"></span><span style="width:${ct[i][1]/mx*100}%"></span></div><small>${ct[i][0]} em campo, ${ct[i][1]} em estufa. ${m[1]}</small></button>`).join("")+`<p class="leg">Toque em um mês para ver as culturas dele.</p>`}
$("#app").innerHTML=h}
const $=s=>document.querySelector(s);
document.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k,v=b.dataset.v;
if(k=="hoje"){st.d=new Date();st.d.setHours(0,0,0,0)}
else if(k=="tab")st.tab=+v;
else if(k=="open"){st.o=st.o||{};const n=decodeURIComponent(v);st.o[n]=!st.o[n]}
else if(k=="all"){const ns=st._L||[];st.o=st.o||{};const ao=ns.every(n=>st.o[n]);ns.forEach(n=>st.o[n]=!ao)}
else if(k=="cat")st.cat=v;
else if(k=="mes"){st.d=new Date(st.d.getFullYear(),+v,15);st.tab=0;scrollTo(0,0)}
else st[k]=st[k]?0:1;
render()});
document.addEventListener("input",e=>{if(e.target.id!="q")return;const o=e.target,p=o.selectionStart;st.q=o.value;render();$("#q").replaceWith(o);o.focus();o.setSelectionRange(p,p)});
document.addEventListener("change",e=>{if(e.target.id=="dt"&&e.target.value){const[y,m,d]=e.target.value.split("-").map(Number);st.d=new Date(y,m-1,d);render()}});
render();
</script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"))</script></body></html>
